use_default_settings: true

search:
  default_lang: "en"
  autocomplete: ""
  safe_search: 0
  formats:
    - html
    - json
  suspended_times:
    SearxEngineAccessDenied: 0
    SearxEngineCaptcha: 0
    SearxEngineTooManyRequests: 0
    cf_SearxEngineCaptcha: 0
    cf_SearxEngineAccessDenied: 0
    recaptcha_SearxEngineCaptcha: 0

server:
  secret_key: "bose-search-secret"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 30.0
  max_request_timeout: 60.0
  proxies:
    all://:
      - socks5h://tor:9150

engines:
  - name: startpage
    weight: 3.0
  - name: github
    weight: 3.0
  - name: stackoverflow
    weight: 3.0
  - name: google
    disabled: true
  - name: bing
    weight: 1.0
  - name: duckduckgo
    disabled: true
  - name: brave
    weight: 1.0
    proxies: {}
  - name: mojeek
    weight: 1.0
  - name: mwmbl
    weight: 1.0
  - name: presearch
    weight: 1.0
  - name: yacy
    weight: 1.0
    base_url:
      - https://yacy.searchlab.eu
      - https://search.lomig.me
  - name: yahoo
    weight: 1.0
  - name: wikipedia
    weight: 2.0
  - name: youtube
    disabled: true
  - name: dailymotion
    disabled: true
