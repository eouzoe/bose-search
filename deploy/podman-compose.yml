version: '3'
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: bose-searxng
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-bose-search-dev}
    restart: unless-stopped
    depends_on:
      tor:
        condition: service_started

  tor:
    image: peterdavehello/tor-socks-proxy:latest
    container_name: bose-tor
    restart: unless-stopped
