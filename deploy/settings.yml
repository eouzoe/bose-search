    weight: 1.5
  - name: swisscows
    disabled: false
  - name: dogpile
    disabled: false
  - name: marginalia
    disabled: false
  - weight: 0.5
    name: yacy
    disabled: false
    base_url:
      - https://yacy.searchlab.eu
      - https://search.lomig.me

  # --- China / Mongolia / Russia angles -------------------------------------
