[package]
name = "bose-crawler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP crawler with PID-based rate control"

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
sysinfo = { workspace = true }

bose-common = { path = "../bose-common" }

[dev-dependencies]
tokio-test = { workspace = true }
wiremock = { workspace = true }

# `io-uring` was previously wired to monoio. It was removed rather than
# left as an unbuilt optional dependency: monoio pulls fxhash, which is
# unmaintained (RUSTSEC-2025-0057) with no patched release, and the feature
# was never enabled in any build. Revisit only with a real io_uring plan.
[features]
default = []
