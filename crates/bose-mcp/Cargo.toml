[package]
name = "bose-search"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zero-cost meta-search MCP server for AI agents — 247 engines, local knowledge index, single binary."
repository = "https://github.com/eouzoe/bose-search"
keywords = ["mcp", "search", "ai-agent", "searxng", "tantivy"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "bose-search"
path = "src/main.rs"

[dependencies]
bose-common = { path = "../bose-common" }
bose-searxng = { path = "../bose-searxng" }
bose-index = { path = "../bose-index" }
rmcp = { version = "0.14", features = ["server", "transport-io", "macros"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
moka = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tempfile = "3"
