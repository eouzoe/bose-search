# Bose Search - Git Hooks Configuration
# Powered by lefthook: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.rs"
      run: cargo fmt --check
      stage_fixed: true

    clippy:
      glob: "*.rs"
      run: cargo clippy --all-targets --all-features -- -D warnings

    typos:
      run: typos

    toml-check:
      glob: "*.toml"
      run: taplo fmt --check

pre-push:
  parallel: false
  commands:
    test:
      run: cargo test --all-features

    audit:
      run: cargo audit

    deny:
      run: cargo deny check

    # Incremental by design. `detect --no-git` walks the entire history and
    # took 264s on every push, which is a gate nobody keeps enabled.
    # `protect --staged` scans only what is being committed, and runs in
    # seconds. A full history sweep is a release action: `just security-full`.
    gitleaks:
      run: gitleaks protect --staged --verbose

commit-msg:
  commands:
    conventional:
      run: |
        # Check if commit message follows conventional commits format
        # Format: <type>(<scope>): <subject>
        # Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
        msg=$(cat {1})
        if ! echo "$msg" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+'; then
          echo "❌ Commit message must follow conventional commits format:"
          echo "   <type>(<scope>): <subject>"
          echo ""
          echo "   Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
          echo "   Example: feat(mcp): add web_search tool"
          exit 1
        fi
